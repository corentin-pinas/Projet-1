<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23705F">
<title>Mes patients</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="maj" id="maj" hidden role="status">
  <span>Une nouvelle version de l'appli est prête.</span>
  <button class="primary" id="majbtn">Mettre à jour</button>
</div>
<div class="app">
  <div class="side">
    <h1>Mes patients</h1>
    <button class="primary" id="add">Ajouter des bilans</button>
    <input type="file" id="file" accept="application/pdf,image/*" multiple hidden>
    <input type="search" id="q" placeholder="Rechercher un patient" aria-label="Rechercher un patient">
    <div class="panel list" id="list"><div class="note">Chargement…</div></div>
    <button class="etat" id="etatbtn"><span class="pastille-mini" id="etatpastille" aria-hidden="true"></span><span id="etattxt">État de l'appli</span></button>
  </div>
  <main class="panel main" id="main"></main>
</div>
<dialog class="etatdlg" id="etatdlg" aria-labelledby="etattitre">
  <div class="head"><div><h2 id="etattitre">État de l'appli</h2><div class="meta">Version <span id="version"></span></div></div><button id="etatclose">Fermer</button></div>
  <ul class="checks" id="checks" aria-live="polite"></ul>
  <section class="iabox" aria-labelledby="iatitre">
    <h3 id="iatitre">IA Claude</h3>
    <p class="note" id="iaetat"></p>
    <div class="vedit" id="iaform">
      <input type="password" id="iacle" placeholder="Collez ici la clé (elle commence par sk-ant-)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Clé de l'IA">
      <button class="primary" id="iasave">Enregistrer la clé</button>
    </div>
    <button id="iadel" hidden>Retirer la clé de cette tablette</button>
  </section>
  <div class="actions">
    <button class="primary" id="persist" hidden>Protéger mes données</button>
    <button id="refresh">Vérifier à nouveau</button>
  </div>
  <p class="note">Les données restent dans cette tablette. Seuls le bilan à résumer et le texte des séances partent vers l'IA, le temps du traitement.</p>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
